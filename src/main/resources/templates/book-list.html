<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library - Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>📚 Book Management</h2>
    <div class="mb-3">
        <a href="/books/new" class="btn btn-primary">+ Add New Book</a>
        <a href="/members" class="btn btn-info">View Members</a>
        <a href="/transactions" class="btn btn-warning">View Transactions</a>
        <a th:href="'/books/edit/' + ${b.bookId}" class="btn btn-warning btn-sm">Edit</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${books}">
                <td th:text="${b.bookId}">1</td>
                <td th:text="${b.title}">Title</td>
                <td th:text="${b.author}">Author</td>
                <td th:text="${b.isbn}">ISBN</td>
                <td>
                    <span th:if="${b.available}" class="badge bg-success">Available</span>
                    <span th:unless="${b.available}" class="badge bg-danger">Borrowed</span>
                </td>
                <td>
                    <a th:href="'/books/delete/' + ${b.bookId}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this book?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
