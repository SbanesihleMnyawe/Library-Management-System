<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library - Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>👤 Member Management</h2>
    <div class="mb-3">
        <a href="/members/new" class="btn btn-primary">+ Add New Member</a>
        <a href="/books" class="btn btn-info">View Books</a>
        <a href="/transactions" class="btn btn-warning">View Transactions</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Member Since</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${members}">
                <td th:text="${m.memberId}">1</td>
                <td th:text="${m.name}">Name</td>
                <td th:text="${m.email}">Email</td>
                <td th:text="${m.phone}">Phone</td>
                <td th:text="${m.membershipDate}">Date</td>
                <td>
                    <a th:href="'/members/delete/' + ${m.memberId}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this member?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
